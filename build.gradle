plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

version = mod_version
group = mod_group

base {
    archivesName = 'prideslegacy'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {}
    server { programArgument '--nogui' }
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
            includeGroup('com.eliotlash.mclib')
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.8.4'

    // Development-only copy of the installed Circle of Craft jar.
    // Copy it from your CurseForge profile into libs/circleofcraft.jar.
    implementation files('libs/circleofcraft.jar')
}

tasks.withType(ProcessResources).configureEach {
    def props = [
        minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version
    ]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
